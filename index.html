<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brevo Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pageLayout">
        <div class="pageContentWrapper">
            <div class="brevo-logo__wrapper">
                <img class="brevo-logo" src="asset/brevoLogo.png" />
            </div>
            <form class="login-form">
                <div class="login-form__heading">Log In</div>
                <div class="login-form__content">
                    <div class="login-form__fields">
                        <div class="login-form__field">
                            <div class="login-form__label">
                                Email address:
                                <span class="required">*</span>
                            </div>
                            <input class="login-form__input" type="text" id="email" name="email">
                        </div>
                        <div class="login-form__field">
                            <div class="login-form__label">
                                Password:
                                <span class="required">*</span>
                            </div>
                            <input class="login-form__input" type="password" id="password" name="password">
                        </div>
                        <div class="login-form__field">
                            <button class="login-button" type="submit">Log In</button>
                        </div>
                    </div>
                    <div class="login-form__divider">
                        <div class="login-form__divider-line"></div>
                        <span class="login-form__divider-text">OR</span>
                       <div class="login-form__divider-line"></div>
                    </div>
                    <div class="login-form__socials">
                        <button class="social-button">
                            <img class="social-button__logo" src="asset/googleLogo.png" />
                            <span class="social-button__text">Sign in with Google</span>
                        </button>
                        <button class="social-button">
                            <img class="social-button__logo" src="asset/appleLogo.png" />
                            <span class="social-button__text">Sign in with Apple</span>
                        </button>
                    </div>
                </div>
            </form>
             <footer>
                <a>Create an account</a>
                <a>I forgot my password</a>
            </footer>
        </div>
    </div>    

    <script src="index.js"></script>
</body>
</html>
